<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>stud.io — Gamified Learning, Pattern Intelligence & NeuroAdapt Neural Platform</title>
  
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;600&family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@500;700;800&display=swap" rel="stylesheet">
  
  <!-- External Stylesheet Link -->
  <link rel="stylesheet" href="styles.css?v=4" />
</head>
<body>
  <!-- Root App Shell Container -->
  <div id="app-root">
    <section class="landing-hero" style="min-height: 80vh; justify-content: center;">
      <div class="landing-badge">
        <span>Powered by Pattern Intelligence & NeuroAdapt™ Neural Engine</span>
      </div>
      <h1 class="landing-title">
        The Only Study App <br/>
        <span class="gradient-text">You Will Ever Need.</span>
      </h1>
      <p class="landing-subtitle">
        Pre-downloaded past paper patterns, NotebookLM dual-host podcasts, Duolingo-style quest tracks, 
        and active recall built for students worldwide.
      </p>

      <div class="landing-cta-group">
        <button id="btn-launch-fallback" onclick="window.studioApp && window.studioApp.openOnboardingModal()" class="btn-primary btn-large">
          <span>Personalize with AI Onboarding</span>
        </button>
        <button onclick="window.studioApp && window.studioApp.renderAppShell()" class="btn-secondary btn-large glow-btn">
          <span>Enter Dashboard Directly</span>
        </button>
      </div>
    </section>
  </div>

  <!-- Unified Bundle Script -->
  <script src="bundle.js"></script>
</body>
</html>
