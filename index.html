<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>stud.io — Gamified Learning, Pattern Intelligence & NeuroAdapt Neural Platform</title>
  
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;600&family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@500;700;800&display=swap" rel="stylesheet">
  
  <!-- CSS Stylesheet -->
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <!-- Container for Landing Page vs App View Shell -->
  <div id="app-root">
    <section class="landing-hero" style="min-height: 80vh; justify-content: center;">
      <div class="landing-badge">✨ Powered by Pattern Intelligence & NeuroAdapt™ Neural Engine</div>
      <h1 class="landing-title">
        The Only Study App <br/>
        <span class="gradient-text">You Will Ever Need.</span>
      </h1>
      <p class="landing-subtitle">
        Pre-downloaded past paper patterns, NotebookLM dual-host podcasts, Duolingo-style quest tracks, 
        and active recall built for students worldwide.
      </p>
      <div class="landing-cta-group">
        <button onclick="window.studioApp && window.studioApp.openOnboardingModal()" class="btn-primary btn-large">
          🚀 Launch stud.io (Free)
        </button>
      </div>
    </section>
  </div>

  <!-- Database & Vector Engine -->
  <script src="data/syllabi.js"></script>
  <script src="data/pastPapers.js"></script>
  <script src="data/podcasts.js"></script>
  <script src="data/duolingoQuests.js"></script>
  <script src="data/flashcards.js"></script>
  <script src="data/extracurricular.js"></script>

  <!-- Core Core DB & Vector -->
  <script src="db/database.js"></script>
  <script src="db/vectorEngine.js"></script>

  <!-- NeuroAdapt Neural Engine -->
  <script src="neuro/neuroFeatureVector.js"></script>
  <script src="neuro/neuroNet.js"></script>
  <script src="neuro/neuroNotesAnalyzer.js"></script>

  <!-- Agents & Audio -->
  <script src="agents/agentCluster.js"></script>
  <script src="agents/feynmanAgent.js"></script>
  <script src="audio/audioSynth.js"></script>
  <script src="audio/soundscapeSynth.js"></script>

  <!-- Application Modules -->
  <script src="modules/landingPage.js"></script>
  <script src="modules/onboarding.js"></script>
  <script src="modules/neuroDashboard.js"></script>
  <script src="modules/studentNotes.js"></script>
  <script src="modules/patternAnalyzer.js"></script>
  <script src="modules/notebookLM.js"></script>
  <script src="modules/duolingoTrack.js"></script>
  <script src="modules/activeRecall.js"></script>
  <script src="modules/pomodoro.js"></script>
  <script src="modules/examSimulator.js"></script>
  <script src="modules/digitalVault.js"></script>
  <script src="modules/extracurricular.js"></script>

  <!-- Central App Router & Controller -->
  <script src="app.js"></script>
</body>
</html>
